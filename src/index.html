<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Pocket</title>
    <link rel="stylesheet" href="../node_modules/pretendard/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Planner</p>
          <h1>Day Pocket</h1>
        </div>
        <div class="topbar-actions">
          <button id="category-manager-button" class="ghost-button" type="button">
            <i data-lucide="tags" aria-hidden="true"></i>
            <span>분류</span>
          </button>
          <button id="status-manager-button" class="ghost-button" type="button">
            <i data-lucide="circle-dot" aria-hidden="true"></i>
            <span>상태</span>
          </button>
          <button id="back-button" class="ghost-button hidden" type="button">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span>Back</span>
          </button>
          <div class="counter" id="counter">0 items</div>
        </div>
      </header>

      <section class="workspace">
        <section class="list-view" id="list-view" aria-label="Items">
          <div class="list-toolbar">
            <div class="filterbar">
              <i data-lucide="filter" aria-hidden="true"></i>
              <select id="category-filter" aria-label="Filter by category"></select>
            </div>
            <div class="filterbar">
              <i data-lucide="circle-dot" aria-hidden="true"></i>
              <select id="status-filter" aria-label="Filter by status"></select>
            </div>
            <div class="filterbar">
              <i data-lucide="arrow-up-down" aria-hidden="true"></i>
              <select id="sort-select" aria-label="Sort items">
                <option value="updated-desc">최근 수정순</option>
                <option value="updated-asc">오래된 수정순</option>
                <option value="created-desc">최근 생성순</option>
                <option value="title-asc">제목순</option>
                <option value="category-asc">분류순</option>
                <option value="status-asc">상태순</option>
              </select>
            </div>

            <div class="search-field">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="item-search-input" type="search" placeholder="일감 검색" autocomplete="off" />
            </div>

            <button id="new-item-button" class="primary-button" type="button">
              <i data-lucide="plus" aria-hidden="true"></i>
              <span>New</span>
            </button>
          </div>

          <ul class="item-list" id="item-list"></ul>
        </section>

        <section class="detail-view hidden" id="detail-view" aria-label="Item detail">
          <div class="empty-state" id="empty-state">
            <h2>선택된 항목이 없습니다</h2>
            <p>목록에서 일감이나 프로젝트를 선택하면 상세 내용을 편집할 수 있습니다.</p>
          </div>

          <article class="detail-card hidden" id="detail-card">
            <div class="detail-header">
              <input id="detail-title" class="detail-title-input" type="text" aria-label="Title" />
              <button id="delete-item-button" class="danger-button icon-only-button" type="button" aria-label="Delete item">
                <i data-lucide="trash-2" aria-hidden="true"></i>
              </button>
            </div>

            <label class="field compact-field">
              <span>분류</span>
              <select id="detail-category-select" aria-label="Detail category"></select>
            </label>
            <label class="field compact-field">
              <span>상태</span>
              <select id="detail-status-select" aria-label="Detail status"></select>
            </label>

            <section class="field">
              <span>내용</span>
              <div class="editor-shell">
                <div class="editor-toolbar" aria-label="Editor toolbar">
                  <button type="button" data-command="bold" title="Bold"><i data-lucide="bold" aria-hidden="true"></i></button>
                  <button type="button" data-command="italic" title="Italic"><i data-lucide="italic" aria-hidden="true"></i></button>
                  <button type="button" data-command="underline" title="Underline"><i data-lucide="underline" aria-hidden="true"></i></button>
                  <button type="button" data-command="insertUnorderedList" title="Bullet list"><i data-lucide="list" aria-hidden="true"></i></button>
                  <button type="button" data-command="insertOrderedList" title="Numbered list"><i data-lucide="list-ordered" aria-hidden="true"></i></button>
                  <button type="button" data-command="formatBlock" data-value="<blockquote>" title="Quote"><i data-lucide="quote" aria-hidden="true"></i></button>
                  <button type="button" data-command="removeFormat" title="Clear format"><i data-lucide="eraser" aria-hidden="true"></i></button>
                </div>
                <div
                  id="detail-content"
                  class="editor"
                  contenteditable="true"
                  role="textbox"
                  aria-label="Content"
                  data-placeholder="메모, 진행 상황, 참고 내용을 적어두세요"
                ></div>
              </div>
            </section>

            <section class="subtasks">
              <div class="section-title">
                <h2>하위 일감</h2>
                <span id="subtask-count">0 tasks</span>
              </div>

              <form class="subtask-form" id="subtask-form">
                <input id="subtask-input" type="text" placeholder="하위 일감 추가" autocomplete="off" />
                <button type="submit">Add</button>
              </form>

              <ul class="subtask-list" id="subtask-list"></ul>
            </section>
          </article>
        </section>
      </section>
    </main>

    <template id="item-template">
      <li class="item-card">
        <div class="item-main">
          <button type="button" class="expand-button" aria-label="Toggle item">▸</button>
          <button type="button" class="item-select">
            <span class="item-heading">
              <span class="category-tag"></span>
              <span class="status-tag"></span>
              <span class="item-title"></span>
            </span>
            <span class="item-meta"></span>
          </button>
        </div>
        <div class="item-preview"></div>
      </li>
    </template>

    <template id="subtask-template">
      <li class="subtask-item">
        <label>
          <input type="checkbox" />
          <span></span>
        </label>
        <button type="button" class="icon-button" aria-label="Delete subtask">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </li>
    </template>

    <div class="overlay hidden" id="category-overlay" role="dialog" aria-modal="true" aria-labelledby="category-overlay-title">
      <section class="overlay-panel">
        <div class="overlay-header">
          <div>
            <p class="eyebrow">Categories</p>
            <h2 id="category-overlay-title">분류 관리</h2>
          </div>
          <button id="category-overlay-close" class="icon-button" type="button" aria-label="Close category manager">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <form class="category-form" id="category-form">
          <input id="category-name-input" type="text" placeholder="새 분류 이름" autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <ul class="category-list" id="category-list"></ul>
      </section>
    </div>

    <div class="overlay hidden" id="status-overlay" role="dialog" aria-modal="true" aria-labelledby="status-overlay-title">
      <section class="overlay-panel">
        <div class="overlay-header">
          <div>
            <p class="eyebrow">Statuses</p>
            <h2 id="status-overlay-title">상태 관리</h2>
          </div>
          <button id="status-overlay-close" class="icon-button" type="button" aria-label="Close status manager">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <form class="category-form" id="status-form">
          <input id="status-name-input" type="text" placeholder="새 상태 이름" autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <ul class="category-list" id="status-list"></ul>
      </section>
    </div>

    <div class="overlay hidden" id="item-overlay" role="dialog" aria-modal="true" aria-labelledby="item-overlay-title">
      <section class="overlay-panel">
        <div class="overlay-header">
          <div>
            <p class="eyebrow">New Item</p>
            <h2 id="item-overlay-title">일감 추가</h2>
          </div>
          <button id="item-overlay-close" class="icon-button" type="button" aria-label="Close item form">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <form class="item-create-form" id="item-form">
          <label class="field">
            <span>제목</span>
            <input id="item-title-input" type="text" placeholder="새 일감 또는 프로젝트" autocomplete="off" />
          </label>
          <label class="field">
            <span>분류</span>
            <select id="item-category-select" aria-label="Category"></select>
          </label>
          <label class="field">
            <span>상태</span>
            <select id="item-status-select" aria-label="Status"></select>
          </label>
          <button type="submit">Add</button>
        </form>
      </section>
    </div>

    <script src="../node_modules/lucide/dist/umd/lucide.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
