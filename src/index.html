<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Pocket</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Planner</p>
          <h1>Day Pocket</h1>
        </div>
        <div class="counter" id="counter">0 items</div>
      </header>

      <section class="workspace">
        <section class="list-pane" aria-label="Items">
          <form class="composer" id="item-form">
            <input id="item-title-input" type="text" placeholder="새 일감 또는 프로젝트" autocomplete="off" />
            <button type="submit">Add</button>
          </form>

          <ul class="item-list" id="item-list"></ul>
        </section>

        <section class="detail-pane" id="detail-pane" aria-label="Item detail">
          <div class="empty-state" id="empty-state">
            <h2>선택된 항목이 없습니다</h2>
            <p>왼쪽에서 일감이나 프로젝트를 선택하면 상세 내용을 편집할 수 있습니다.</p>
          </div>

          <article class="detail-card hidden" id="detail-card">
            <div class="detail-header">
              <input id="detail-title" class="detail-title-input" type="text" aria-label="Title" />
              <button id="delete-item-button" class="danger-button" type="button">Delete</button>
            </div>

            <section class="field">
              <span>내용</span>
              <div class="editor-shell">
                <div class="editor-toolbar" aria-label="Editor toolbar">
                  <button type="button" data-command="bold" title="Bold">B</button>
                  <button type="button" data-command="italic" title="Italic">I</button>
                  <button type="button" data-command="underline" title="Underline">U</button>
                  <button type="button" data-command="insertUnorderedList" title="Bullet list">• List</button>
                  <button type="button" data-command="formatBlock" data-value="<blockquote>" title="Quote">Quote</button>
                  <button type="button" data-command="removeFormat" title="Clear format">Clear</button>
                </div>
                <div
                  id="detail-content"
                  class="editor"
                  contenteditable="true"
                  role="textbox"
                  aria-label="Content"
                  data-placeholder="메모, 진행 상황, 참고 내용을 적어두세요"
                ></div>
              </div>
            </section>

            <section class="subtasks">
              <div class="section-title">
                <h2>하위 일감</h2>
                <span id="subtask-count">0 tasks</span>
              </div>

              <form class="subtask-form" id="subtask-form">
                <input id="subtask-input" type="text" placeholder="하위 일감 추가" autocomplete="off" />
                <button type="submit">Add</button>
              </form>

              <ul class="subtask-list" id="subtask-list"></ul>
            </section>
          </article>
        </section>
      </section>
    </main>

    <template id="item-template">
      <li class="item-card">
        <div class="item-main">
          <button type="button" class="expand-button" aria-label="Toggle item">▸</button>
          <button type="button" class="item-select">
            <span class="item-title"></span>
            <span class="item-meta"></span>
          </button>
        </div>
        <div class="item-preview"></div>
      </li>
    </template>

    <template id="subtask-template">
      <li class="subtask-item">
        <label>
          <input type="checkbox" />
          <span></span>
        </label>
        <button type="button" class="icon-button" aria-label="Delete subtask">×</button>
      </li>
    </template>

    <script src="./renderer.js"></script>
  </body>
</html>
